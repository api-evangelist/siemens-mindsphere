apis:
- aid: siemens-mindsphere:identity-management-api
  name: Siemens MindSphere Identity Management API
  tags:
  - Identity
  - Access Management
  - Users
  - Industrial
  humanURL: >-
    https://documentation.mindsphere.io/MindSphere/apis/core-identitymanagement/api-identitymanagement-overview.html
  properties:
  - url: >-
      https://documentation.mindsphere.io/MindSphere/apis/core-identitymanagement/api-identitymanagement-overview.html
    type: Documentation
  description: >-
    Manages environments, users, and groups within MindSphere (Insights Hub). Provides user provisioning,
    group membership management, and role assignment for industrial IoT platform access control.
- aid: siemens-mindsphere:iot-file-service-api
  name: Siemens MindSphere IoT File Service API
  tags:
  - IoT
  - File Management
  - Storage
  - Industrial
  humanURL: >-
    https://documentation.mindsphere.io/MindSphere/apis/iot-iotfile/api-iotfile-overview.html
  properties:
  - url: >-
      https://documentation.mindsphere.io/MindSphere/apis/iot-iotfile/api-iotfile-overview.html
    type: Documentation
  description: >-
    File management service for files related to IoT assets. Enables uploading, downloading, and managing
    files attached to asset instances such as firmware images, configuration files, and maintenance records.
- aid: siemens-mindsphere:event-management-api
  name: Siemens MindSphere Event Management API
  tags:
  - IoT
  - Events
  - Alerts
  - Industrial
  humanURL: >-
    https://documentation.mindsphere.io/MindSphere/apis/advanced-eventmanagement/api-eventmanagement-overview.html
  properties:
  - url: >-
      https://documentation.mindsphere.io/MindSphere/apis/advanced-eventmanagement/api-eventmanagement-overview.html
    type: Documentation
  description: >-
    The Event Management Service captures and manages events generated by industrial devices in MindSphere.
    Events represent significant occurrences such as alarms, machine state changes, maintenance triggers,
    and threshold violations from connected industrial equipment.
- aid: siemens-mindsphere:agent-management-api
  name: Siemens MindSphere Agent Management API
  tags:
  - IoT
  - Connectivity
  - Agent
  - Industrial
  humanURL: >-
    https://documentation.mindsphere.io/MindSphere/apis/connectivity-agentmanagement/api-agentmanagement-overview.html
  properties:
  - url: >-
      https://documentation.mindsphere.io/MindSphere/apis/connectivity-agentmanagement/api-agentmanagement-overview.html
    type: Documentation
  description: >-
    API to onboard, offboard, update, and delete MindConnect agents that act as gateways connecting field
    devices to the MindSphere platform. Manages agent configurations and certificates for secure connectivity.
- aid: siemens-mindsphere:mindconnect-nodejs-sdk
  name: Siemens MindConnect Node.js SDK
  tags:
  - SDK
  - Node.js
  - TypeScript
  - IoT
  - Connectivity
  humanURL: >-
    https://developer.siemens.com/industrial-iot-open-source/mindconnect-nodejs/sdk/index.html
