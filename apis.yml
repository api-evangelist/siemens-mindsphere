  - url: https://github.com/mindsphere/mindconnect-nodejs
    type: GitHub
  - url: https://www.npmjs.com/package/@mindconnect/mindconnect-nodejs
    type: SDKs
  description: >-
    TypeScript and JavaScript community SDK for Industrial IoT APIs providing convenient wrappers around
    the MindSphere REST APIs for asset management, time series, file upload, and event management.
