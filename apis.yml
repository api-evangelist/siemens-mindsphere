description: Siemens MindSphere (now Insights Hub) is Siemens' Industrial IoT as a
  Service platform that connects industrial machines and assets to the cloud. It enables
  companies to harness the wealth of data generated by their operations through APIs
  for asset management, time series data ingestion, event management, file services,
  identity management, and agent connectivity. MindSphere supports digital twin creation
  and industrial analytics use cases across manufacturing, energy, transportation,
  and infrastructure.
